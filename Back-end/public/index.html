<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js API Status</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center">
    <div class="text-center">
        <!-- Animated spinning icon -->
        <div class="mb-6">
            <svg class="animate-spin h-16 w-16 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <!-- Animated text -->
        <h1 class="text-4xl font-bold text-white mb-4 animate-pulse"> API is Running!</h1>
        <p class="text-lg text-white opacity-80 animate-fade-in">server is up and ready to handle requests.</p>
        <!-- Additional animated element -->
        <div class="mt-8">
            <div class="inline-block bg-white bg-opacity-20 rounded-full px-6 py-3 animate-bounce">
                <span class="text-white font-semibold">Status: Online</span>
            </div>
        </div>
    </div>

    <!-- Custom CSS for fade-in animation -->
    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 1s ease-out;
        }
    </style>
</body>
</html>
